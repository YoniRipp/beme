name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  agent-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check AGENTS.md is in sync with CLAUDE.md
        run: npm run sync:agents -- --check

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Lint backend
        run: npm run lint
        working-directory: backend
      - name: Test backend
        run: npm run test
        working-directory: backend
      - name: Build backend
        run: npm run build
        working-directory: backend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile .
      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile --build-arg VITE_API_URL=http://localhost:3000 .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Test frontend
        run: npm run test -- --run
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install mobile dependencies
        run: npm ci
      - name: Typecheck mobile
        run: npx tsc --noEmit
        working-directory: mobile
      - name: Test mobile
        run: npm run test
        working-directory: mobile

  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test shared
        run: npm run test
        working-directory: packages/shared

  # Not a workspace -- backend/mcp-server ships separately and carries its own lockfile, so
  # it needs its own install. It had no job at all until now, which meant a Dependabot PR
  # against it went green on checks that never touched it.
  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/mcp-server/package-lock.json
      - name: Install MCP server dependencies
        run: npm ci
        working-directory: backend/mcp-server
      - name: Smoke-test the MCP server
        run: npm test
        working-directory: backend/mcp-server
      # The security-audit matrix below runs `npm audit --workspace <project>`, which cannot
      # reach this package for the same reason it needed its own job: it is not a workspace and
      # the root lockfile knows nothing about it. So the audit belongs here, on the job that has
      # already installed its lockfile. Same threshold and same advisory posture as that matrix
      # -- it reports rather than blocks.
      - name: Audit MCP server dependencies
        run: npm audit --audit-level=critical
        working-directory: backend/mcp-server
        continue-on-error: true

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: trackvibe
          POSTGRES_PASSWORD: trackvibe_test_password
          POSTGRES_DB: trackvibe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackvibe -d trackvibe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Run migrations
        run: npm run migrate:up
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://trackvibe:trackvibe_test_password@localhost:5432/trackvibe_test
          DB_SSL: 'false'
      # migrations/ and src/db/schema.ts are independent bootstrap paths -- production uses
      # the first, dev machines the second. When they drift, the symptom is a runtime
      # "column does not exist" from whichever model selects it, so compare them here.
      - name: Bootstrap a second database from initSchema
        run: |
          PGPASSWORD=trackvibe_test_password createdb -h localhost -U trackvibe trackvibe_initschema
          npm run schema:init
        working-directory: backend
        env:
          NODE_ENV: development
          PORT: '3000'
          JWT_SECRET: ci-schema-drift-check
          DATABASE_URL: postgresql://trackvibe:trackvibe_test_password@localhost:5432/trackvibe_initschema
          DB_SSL: 'false'
      - name: Check the two bootstrap paths agree
        run: npm run check:schema-drift
        working-directory: backend
        env:
          MIGRATED_DATABASE_URL: postgresql://trackvibe:trackvibe_test_password@localhost:5432/trackvibe_test
          INIT_DATABASE_URL: postgresql://trackvibe:trackvibe_test_password@localhost:5432/trackvibe_initschema

  security-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        project: [backend, frontend, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=critical --workspace ${{ matrix.project }}
