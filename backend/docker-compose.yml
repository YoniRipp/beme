version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: trackvibe
      POSTGRES_PASSWORD: trackvibe_dev_password
      POSTGRES_DB: trackvibe_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackvibe"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Context is the repo root: this is an npm workspace with a single root
    # package-lock.json, so `npm ci` inside the image has to run from there.
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://trackvibe:trackvibe_dev_password@postgres:5432/trackvibe_dev
      DB_SSL: "false"
      JWT_SECRET: dev-secret-key-minimum-32-characters-long
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/repo/backend/src

volumes:
  postgres_data:
